[project]
name = "duediligence"
version = "0.1.0"
description = "AI-powered due diligence system for company and leadership analysis"
readme = "README.md"
requires-python = ">=3.13"
license = { text = "MIT" }
authors = [{ name = "Gabe" }]
dependencies = [
    # Web & async
    "fastapi>=0.115.0",
    "uvicorn[standard]>=0.48.0",
    "httpx>=0.27.0",
    # Data contracts
    "pydantic>=2.9.0",
    "pydantic-settings>=2.5.0",
    # CLI
    "typer>=0.12.0",
    # Logging
    "structlog>=24.4.0",
    "rich>=15.0.0",
]

[project.scripts]
duediligence = "duediligence.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/duediligence"]

[dependency-groups]
dev = [
    "ruff>=0.7.0",
    "mypy>=1.13.0",
    "pytest>=8.3.0",
    "pytest-asyncio>=0.24.0",
    "pytest-cov>=6.0.0",
    "hypothesis>=6.115.0",
    "pre-commit>=4.0.0",
]

# ---------- Ruff (lint + format) ----------
[tool.ruff]
line-length = 100
target-version = "py313"
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E", "W",      # pycodestyle
    "F",           # pyflakes
    "I",           # isort
    "B",           # flake8-bugbear
    "C4",          # flake8-comprehensions
    "UP",          # pyupgrade
    "N",           # pep8-naming
    "SIM",         # flake8-simplify
    "RUF",         # ruff-specific
    "ANN",         # flake8-annotations
    "ASYNC",       # flake8-async
    "S",           # flake8-bandit (security)
    "T20",         # flake8-print
    "PT",          # flake8-pytest-style
    "RET",         # flake8-return
    "TRY",         # tryceratops
]
ignore = [
    "ANN401",      # allow `Any` where genuinely needed
    "ANN101",      # don't require annotations on `self` — PEP 484 says no
    "ANN102",      # don't require annotations on `cls` — PEP 484 says no
    "TRY003",      # long messages in raises are fine
]

[tool.ruff.lint.per-file-ignores]
"tests/**/*.py" = ["S101", "ANN"]  # asserts and untyped fixtures fine in tests

[tool.ruff.format]
quote-style = "double"
indent-style = "space"

# ---------- mypy (strict typing) ----------
[tool.mypy]
python_version = "3.13"
strict = true
warn_unreachable = true
warn_return_any = true
disallow_untyped_decorators = true
files = ["src", "tests"]

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false  # test fixtures don't need annotations

# ---------- pytest ----------
[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
addopts = [
    "--strict-markers",
    "--strict-config",
    "--import-mode=importlib",
    "-ra",
]
markers = [
    "integration: requires docker stack (qdrant, ollama)",
    "slow: takes more than a second",
]

# ---------- coverage ----------
[tool.coverage.run]
source = ["src/duediligence"]
branch = true

[tool.coverage.report]
exclude_lines = [
    "pragma: no cover",
    "raise NotImplementedError",
    "if TYPE_CHECKING:",
]
